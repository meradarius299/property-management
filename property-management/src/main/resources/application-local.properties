spring.application.name=property-management
#server-port
server.port=8080
#Allow H2 DB to accessed via browser and via Java Application
spring.h2.console.enabled=true
#DB server Path
spring.h2.console.path=/h2-console
#DB URL and DB name (propertydb)
spring.datasource.url=jdbc:h2:file:~/h2/propertydb
#DB username
spring.datasource.username=sa
#DB pass
spring.datasource.password=12345
#DB driver
spring.datasource.driverClassName=org.h2.Driver
#Tells keeping existing data and table while sever restart, other value is created where after server restarts all tables will be dropped and new tables will be created
spring.jpa.hibernate.ddl-auto=update
#This enables printing of SQL queries generated by hibernate in the console
spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect