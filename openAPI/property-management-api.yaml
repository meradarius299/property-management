openapi: 3.0.3
info:
  title: Property Management API
  description: >
    API for real estate property management (CRUD) and a small
    calculator utility endpoint, exposed by the Spring Boot
    property-management application.
  version: 1.0.0
  contact:
    name: Property Management Team
servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: Properties
    description: CRUD operations on properties
  - name: Calculator
    description: Calculation utility endpoint

paths:
  /api/v1/properties/save:
    post:
      tags: [Properties]
      operationId: saveProperty
      summary: Creates a new property
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropertyDTO'
      responses:
        '201':
          description: Property created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyDTO'

  /api/v1/properties:
    get:
      tags: [Properties]
      operationId: getAllProperties
      summary: Lists all properties
      responses:
        '200':
          description: List of properties
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PropertyDTO'

  /api/v1/properties/{propertyId}:
    put:
      tags: [Properties]
      operationId: updateProperty
      summary: Completely updates a property
      parameters:
        - $ref: '#/components/parameters/PropertyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropertyDTO'
      responses:
        '201':
          description: Property updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyDTO'
    delete:
      tags: [Properties]
      operationId: deleteProperty
      summary: Deletes a property
      parameters:
        - $ref: '#/components/parameters/PropertyId'
      responses:
        '204':
          description: Property deleted

  /api/v1/properties/update_description/{propertyId}:
    patch:
      tags: [Properties]
      operationId: updatePropertyDescription
      summary: Updates only the description of a property
      parameters:
        - $ref: '#/components/parameters/PropertyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropertyDTO'
      responses:
        '200':
          description: Description updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyDTO'

  /api/v1/properties/update_price/{propertyId}:
    patch:
      tags: [Properties]
      operationId: updatePropertyPrice
      summary: Updates only the price of a property
      parameters:
        - $ref: '#/components/parameters/PropertyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropertyDTO'
      responses:
        '200':
          description: Price updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyDTO'

components:
  parameters:
    PropertyId:
      name: propertyId
      in: path
      required: true
      schema:
        type: integer
        format: int64

  schemas:
    PropertyDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        title:
          type: string
        description:
          type: string
        ownerName:
          type: string
        ownerEmail:
          type: string
        price:
          type: number
          format: double
        address:
          type: string