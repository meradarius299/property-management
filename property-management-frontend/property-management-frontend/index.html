<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyProperty</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<section id="auth-screen" class="auth-screen">
    <div class="auth-card">
        <div class="wordmark">MyProperty</div>

        <div class="auth-tabs">
            <button class="auth-tab is-active" data-tab="login">Login</button>
            <button class="auth-tab" data-tab="register">Create account</button>
        </div>

        <form id="login-form" class="auth-form">
            <label>
                Username
                <input type="text" id="login-username" required autocomplete="username">
            </label>
            <label>
                Password
                <input type="password" id="login-password" required autocomplete="current-password">
            </label>
            <button type="submit" class="btn-primary">Login</button>
            <p class="form-message" id="login-message"></p>
        </form>

        <form id="register-form" class="auth-form is-hidden">
            <label>
                Username
                <input type="text" id="register-username" required>
            </label>
            <label>
                Email
                <input type="email" id="register-email" required>
            </label>
            <label>
                Password
                <input type="password" id="register-password" required>
            </label>
            <label>
                Role
                <select id="register-role">
                    <option value="OWNER">Owner</option>
                    <option value="BUYER">Buyer</option>
                </select>
            </label>
            <button type="submit" class="btn-primary">Create account</button>
            <p class="form-message" id="register-message"></p>
        </form>
    </div>
</section>

<section id="dashboard-screen" class="dashboard-screen is-hidden">
    <header class="topbar">
        <div class="wordmark wordmark--small">MyProperty</div>
        <div class="topbar-user">
            <span class="role-badge" id="role-badge"></span>
            <span id="username-display"></span>
            <button id="logout-btn" class="btn-ghost">Logout</button>
        </div>
    </header>

    <main class="content">
        <div class="content-head">
            <h1 id="content-title">Properties</h1>
            <button id="add-property-btn" class="btn-primary is-hidden">Add Property</button>
        </div>
        <p class="content-note" id="content-note"></p>

        <form id="add-property-form" class="property-form is-hidden">
            <input type="text" id="prop-title" placeholder="Title" required>
            <input type="text" id="prop-address" placeholder="Address" required>
            <input type="number" id="prop-price" placeholder="Price (EUR)" step="0.01" required>
            <input type="text" id="prop-description" placeholder="Description">
            <button type="submit" class="btn-primary">Save</button>
        </form>

        <table class="property-table">
            <thead id="table-head"></thead>
            <tbody id="table-body"></tbody>
        </table>
        <p class="empty-state is-hidden" id="empty-state">No properties to display at this time.</p>
    </main>
</section>

<script src="app.js"></script>
</body>
</html>
